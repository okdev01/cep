name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest -v
      - run: python main.py --smoke-test smoke-result.json --preview preview-ci.png
      - run: python build.py
      - shell: pwsh
        run: |
          $app = Start-Process -FilePath '.\dist\Cep\Cep.exe' -ArgumentList '--smoke-test packaged-smoke.json' -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Get-Content packaged-smoke.json | ConvertFrom-Json).ok) { throw 'Packaged smoke report failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Cep-Windows-x64
          path: |
            release/*
            packaged-smoke.json
            preview-ci.png
